services:
  db:
    image: postgres:16-alpine
    container_name: chatbot_clinica_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  ollama:
    image: ollama/ollama
    container_name: chatbot_clinica_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  telegram-bot-doctor:
    build: ./bot
    container_name: chatbot_clinica_telegram_doctor
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
    depends_on:
      - db

  telegram-bot-paciente:
    build: ./bot
    container_name: chatbot_clinica_telegram_paciente
    restart: always
    command: ["python", "bot_paciente.py"]
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - POSTGRES_HOST=db
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
    depends_on:
      - ollama
      - db

volumes:
  postgres_data:
  ollama_data:
