services:
  db:
    image: postgres:16-alpine
    container_name: chatbot_clinica_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  telegram-bot:
    build: ./bot
    container_name: chatbot_clinica_telegram
    restart: always
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
